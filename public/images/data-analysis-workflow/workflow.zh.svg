<text x="40" y="966" font-size="23" font-weight="550" fill="#163149" text-anchor="start">明确业务目标，理解并准备数据，用分析支持决策，再验证与持续监控。</text>
<text x="40" y="998" font-size="18" font-weight="400" fill="#53697b" text-anchor="start">环节可往返；新增埋点与 A/B Test 按需开展，前后比较不能单独证明因果。</text>
