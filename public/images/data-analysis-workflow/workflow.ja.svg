<text x="680" y="817" font-size="22" font-weight="650" fill="#163149" text-anchor="start">効果評価・A/Bテスト</text>
<text x="680" y="872" font-size="16" font-weight="400" fill="#53697b" text-anchor="start">成功指標・品質とリスクの指標</text>
<path d="M999 818 H1029" fill="none" stroke="#486b84" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1040" y="745" width="330" height="145" rx="9" fill="#ffffff" stroke="#a86614" stroke-opacity="0.35"/>
