<text x="680" y="232" font-size="22" font-weight="650" fill="#163149" text-anchor="start">業務背景・フロー理解</text>
<text x="680" y="287" font-size="16" font-weight="400" fill="#53697b" text-anchor="start">業界・企業・業務プロセス</text>
