<text x="1060" y="817" font-size="22" font-weight="650" fill="#163149" text-anchor="start">展開・監視・継続改善</text>
<text x="1060" y="872" font-size="16" font-weight="400" fill="#53697b" text-anchor="start">検証結果に基づいて展開を判断</text>
<path d="M1370 818 H1520 V140 H262 V233 H277" fill="none" stroke="#486b84" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1445" y="295" width="47" height="450" rx="12" fill="#fcfaf6" stroke="#d9c5a3"/>
<text transform="translate(1475 520) rotate(-90)" text-anchor="middle" font-size="21" font-weight="650" fill="#7d561c">目標・指標・データを見直す</text>
<path d="M40 926 H1520" stroke="#d7dfdf"/>
<text x="40" y="966" font-size="23" font-weight="550" fill="#163149" text-anchor="start">業務目標を定め、データを理解・準備し、分析で判断を支え、効果検証と監視を続ける。</text>
<text x="40" y="998" font-size="18" font-weight="400" fill="#53697b" text-anchor="start">各段階は行き来できる。追加計測とA/Bテストは必要に応じて実施。前後比較だけでは因果関係は示せない。</text>
