<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1020" viewBox="0 0 1580 1020" xml:lang="ja" role="img" aria-labelledby="title desc">
<title id="title">業務データ分析プロジェクトの全体フロー</title>
<desc id="desc">業務目標からモニタリング・改善へ · 4つの段階と11のステップ. 目標・指標・データを見直す</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#486b84"/></marker></defs>
<rect width="1580" height="1020" fill="#fcfaf6"/>
