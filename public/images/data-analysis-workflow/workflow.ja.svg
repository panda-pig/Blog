<text x="62" y="826" font-size="27" font-weight="700" fill="#ffffff" text-anchor="start">改善・検証</text>
<rect x="280" y="745" width="330" height="145" rx="9" fill="#ffffff" stroke="#a86614" stroke-opacity="0.35"/>
<text x="300" y="782" font-size="28" font-weight="750" fill="#a86614" text-anchor="start">09</text>
<text x="300" y="817" font-size="22" font-weight="650" fill="#163149" text-anchor="start">改善案・試験導入</text>
<text x="300" y="872" font-size="16" font-weight="400" fill="#53697b" text-anchor="start">実験設計は試験導入の前に</text>
<path d="M619 818 H649" fill="none" stroke="#486b84" stroke-width="2.5" marker-end="url(#arrow)"/>
